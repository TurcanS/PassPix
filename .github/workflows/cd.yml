name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            packages: build-essential libsodium-dev
            binary: passpix
          - os: windows-latest
            target: windows
            binary: passpix.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.target == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - uses: msys2/setup-msys2@v2
        if: matrix.target == 'windows'
        with:
          msystem: ucrt64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libsodium

      - name: Build
        run: make PORTABLE=1 WERROR=1

      # A failing test blocks the release
      - name: Test (unit, integration, smoke)
        run: make PORTABLE=1 WERROR=1 test

      - name: Check version matches tag
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          EXPECTED="passpix ${GITHUB_REF_NAME#v}"
          ACTUAL=$("./$BINARY" --version | tr -d '\r')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Binary reports '$ACTUAL' but the tag is '$GITHUB_REF_NAME'. Update src/version.h."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: passpix-${{ matrix.target }}
          path: passpix*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: passpix-linux
          path: release/linux/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: passpix-windows
          path: release/windows/

      - name: Organize and hash
        run: |
          mkdir -p dist
          ls -R release/
          cp release/linux/passpix dist/passpix-linux
          WINFILE=$(find release/windows -type f -not -name "*.md" | head -1)
          cp "$WINFILE" dist/passpix.exe
          ls -la dist/
          echo "LINUX_HASH=$(sha256sum dist/passpix-linux | awk '{print $1}')" >> $GITHUB_ENV
          echo "WIN_HASH=$(sha256sum dist/passpix.exe | awk '{print $1}')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Hashes (SHA-256)

            | Platform | Binary | Hash |
            |---|---|---|
            | Linux | `passpix` | `${{ env.LINUX_HASH }}` |
            | Windows | `passpix.exe` | `${{ env.WIN_HASH }}` |
          files: |
            dist/passpix-linux
            dist/passpix.exe

      - name: Update README with hashes
        run: |
          git fetch origin main
          git checkout main
          TAG="${{ github.ref_name }}"
          LINUX_HASH="${{ env.LINUX_HASH }}"
          WIN_HASH="${{ env.WIN_HASH }}"

          sed -i "s|<!-- VERSION -->.*<!-- /VERSION -->|<!-- VERSION -->${TAG}<!-- /VERSION -->|g" README.md
          sed -i "s|<!-- HASH_LINUX -->\`.*\`<!-- /HASH_LINUX -->|<!-- HASH_LINUX -->\`${LINUX_HASH}\`<!-- /HASH_LINUX -->|" README.md
          sed -i "s|<!-- HASH_WIN -->\`.*\`<!-- /HASH_WIN -->|<!-- HASH_WIN -->\`${WIN_HASH}\`<!-- /HASH_WIN -->|" README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update binary hashes for ${TAG} [skip ci]"
          git push origin main
